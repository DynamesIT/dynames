/* Modulo profili e documenti, versione demo */
.doc-section{grid-column:1/-1;border-top:1px solid var(--line);padding-top:15px;margin-top:3px}
.doc-heading{font-size:13px;color:var(--navy);margin:0 0 3px;font-weight:800}
.doc-note{font-size:11px;color:var(--muted);margin:0 0 14px}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.upload-box{display:flex;flex-direction:column;gap:7px;border:1px dashed #b9c7d7;border-radius:10px;padding:15px;background:#fbfcff;min-width:0}
.upload-box label{font-weight:800;font-size:12px;color:var(--navy)}
.upload-box small{font-size:10px;color:var(--muted)}
.upload-box input[type=file]{max-width:100%;font-size:11px;color:var(--muted)}
.upload-box input[type=file]::file-selector-button{padding:7px 9px;margin-right:9px;border:1px solid #cad3e1;border-radius:6px;background:#fff;color:#24334c;font-weight:700;cursor:pointer}
.upload-preview{display:flex;gap:10px;align-items:center;min-height:48px;color:#53657a;font-size:11px;overflow-wrap:anywhere}
.upload-preview img{width:54px;height:54px;object-fit:cover;object-position:center;border-radius:50%;border:2px solid #e2e8f0;flex-shrink:0}
.upload-preview a{font-size:11px;color:var(--blue);font-weight:700}
.upload-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.upload-actions button{font-size:10px;padding:3px 0;color:#a04040;background:none;border:0;text-decoration:underline}
.file-chip{display:inline-flex;gap:5px;align-items:center;background:#eef3fb;color:#284574;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:700;white-space:nowrap}
.application-card{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.application-card:first-child{border-top:0}
.application-card b{font-size:12px;display:block}
.application-card small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.application-actions{display:flex;gap:7px;flex-wrap:wrap}
.form-subhead{font-size:12px;font-weight:800;color:var(--navy);padding-bottom:7px;border-bottom:1px solid var(--line)}
.form-check{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#53657a;line-height:1.5}
.form-check input{accent-color:#1e3a8a;margin-top:3px}
.demo-warning{color:#734d20;background:#fff8eb;border:1px solid #ecd6b5;border-radius:7px;padding:12px;font-size:11px;margin-bottom:17px}
.person .avatar.has-photo{background:#fff;overflow:hidden}
.person .avatar.has-photo img{width:100%;height:100%;object-fit:cover}
/* Interessi editoriali e scientifici: più scelte per ogni profilo */
.theme-picker{min-width:0;border:0;padding:0;margin:0}
.theme-picker legend{font-weight:700;font-size:11px;color:#4c5d74;margin-bottom:8px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.theme-option{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;border:1px solid #d6deeb;border-radius:7px;background:#fff;color:#344359;cursor:pointer;font-size:11px;line-height:1.35;transition:background-color .15s,border-color .15s}
.theme-option:has(input:checked){background:#eff4fd;border-color:#496eaa;color:#0b254d}
.theme-option input{margin:1px 0 0;flex:none;accent-color:#1e3a8a}
.theme-option:hover{border-color:#8199bd}
.theme-option:focus-within{outline:2px solid #7e9ccf;outline-offset:2px}
.theme-feedback{display:block;margin-top:8px;font-size:11px;color:var(--muted)}
.theme-feedback.error{color:#a13232;font-weight:700}
.member-interests{font-size:10px;max-width:270px;line-height:1.4;color:#61738b;margin-top:3px;overflow-wrap:anywhere}
@media(max-width:760px){.doc-grid,.theme-grid{grid-template-columns:1fr}.application-card{align-items:flex-start;flex-direction:column}}

.workspace-top-link{font-size:11px;font-weight:700;color:#1e3a8a;text-decoration:none;white-space:nowrap}.workspace-logout{background:#fff;border:1px solid #d5deeb;padding:7px 10px;border-radius:6px;color:#1e3a8a;font-weight:700;font-size:11px}#workspace-gate[hidden]{display:none!important}#app[hidden]{display:none!important}

.board-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));height:35px;align-items:center;background:#fbf7ed;border-radius:5px;border:1px solid #f0e7d6}
.board-star{text-align:center;font-size:20px;color:#b8935a;line-height:1;cursor:help}.board-star.board-key{color:#1e3a66;font-size:23px}.legend-star{font-size:15px;color:#b8935a;margin-right:4px}
.activity-code{font-family:Consolas,monospace;font-size:11px;color:#274b81;font-weight:800;white-space:nowrap}
.project-people{color:#5e6c80;font-size:11px}.project-note{background:#f6f8fc;border-left:3px solid #8da3bf;padding:8px 10px;font-size:11px;color:#4b5d76}
.assignment-select{max-width:300px;width:100%}#memberIds{min-height:108px}#outreachEngagements,#outreachComments{min-height:75px}

function reviewApplication(id,approve){const i=applications.findIndex(a=>a.id===id);if(i<0)return;const a=applications.splice(i,1)[0];if(approve){const memberId='m'+Date.now();db.members.push({id:memberId,name:a.name,email:a.email,organization:a.organization,position:a.position,themes:memberThemes(a),bio:a.bio,contributions:a.contributions,area:'Area Operativa',role:'Da assegnare',projects:[],status:'Attivo'});if(a.photo||a.cv)memberFiles.set(memberId,{photo:a.photo,cv:a.cv});save();toast('Candidatura approvata (demo). Nessun accesso al Workspace assegnato.')}else{if(a.photo?.url)URL.revokeObjectURL(a.photo.url);if(a.cv?.url)URL.revokeObjectURL(a.cv.url);toast('Candidatura demo rifiutata.')}render()}

lass="card card-pad"><div class="card-title"><div><h2>Progetti prioritari</h2><p>Stato delle iniziative dimostrative</p></div><button class="linkbutton" data-page="projects">Esplora tutti</button></div>${db.projects.slice(0,4).map(p=>`<div class="loe-item"><div class="loe-row"><strong>${esc(p.name)}</strong>${statusBadge(p.status)}</div></div>`).join('')}</section><section class="card card-pad"><div class="card-title"><div><h2>Modello di coordinamento</h2><p>Collegamento fra governance e attività</p></div></div><div class="section-note" style="margin:0 0 14px">Governance → OS → Quattro LoE → Progetti → Attività codificate → BOARD e report mensile.</div><div class="detail-grid" style="margin-bottom:0"><div><span>Novembre</span><b>Annual Planning BOARD</b></div><div><span>Aprile</span><b>Steering BOARD</b></div><div><span>Altri mesi</span><b>Monthly BOARD</b></div><div><span>Supporto</span><b>Management e Programma di Lavoro</b></div></div></section></div>`}

function timelineRows(tasks){const start=Date.UTC(2027,0,1),end=Date.UTC(2028,0,1),period=end-start;return tasks.filter(t=>t.start<='2027-12-31'&&t.due>='2027-01-01').map(t=>{let x=Math.max(0,Math.min(1,(Date.parse(t.start+'T00:00:00Z')-start)/period)),y=Math.max(0,Math.min(1,(Date.parse(t.due+'T00:00:00Z')-start)/period));let width=Math.max(1,(y-x)*100);let bg=t.loe===3?'gold':t.loe===4?'green':t.loe===2?'navy':'';return `<div class="gantt-row"><div class="gantt-label" title="${esc(t.title)}"><strong class="activity-code">${esc(taskCode(t))}</strong> ${esc(t.title)}<small>LOE ${t.loe} · ${fmtDate(t.due)}</small></div><div class="month-line annual-line"><div class="bar ${bg}" style="left:${(x*100).toFixed(2)}%;width:${Math.min(width,100-x*100).toFixed(2)}%" title="${esc(taskCode(t))} · ${esc(t.title)}"></div></div></div>`}).join('')||'<p class="muted">Nessuna attività nel 2027 per il filtro selezionato.</p>'}

ount <b>approvati e attivi</b> presenti in Supabase. Gli assegnamenti, i commenti Outreach e gli stati progettuali sono ancora dati dimostrativi locali, non visibili agli altri membri.</div>`}

function renderAccess(){let u=db.users.find(x=>x.id===currentUserId)||db.users[0];return `${pagehead('Amministrazione','Accessi e permessi','Configurazione centralizzata degli account e delle autorizzazioni. In questa demo i cambiamenti sono locali.',btn(`${ic('plus')} Nuovo utente`,'newUser','btn-primary'))}${banner()}<div class="permission-grid"><section class="card card-pad"><div class="card-title"><div><h2>Utenti Workspace</h2><p>Account separati dall'anagrafica dei membri</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Utente</th><th>Livello</th><th>Ambito</th><th>Accesso</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><div class="muted" style="font-size:10px">${esc(u.email)}</div></td><td>${esc(u.role)}</td><td>${esc(u.scope)}</td><td>${statusBadge(u.active?'Attivo':'Sospeso')}</td><td><button data-action="chooseUser" data-id="${esc(u.id)}" class="linkbutton">Configura</button></td></tr>`).join('')}</tbody></table></div><div class="section-note">La futura autenticazione reale richiederà un provider sicuro e controlli lato server/database: le selezioni qui visualizzate non proteggono i dati.</div></section><section class="card card-pad"><div class="card-title"><div><h2>Profilo e autorizzazioni</h2><p>${esc(u.name)}</p></div></div><div class="form-line" style="margin-bottom:14px"><label for="user-role">Livello di accesso</label><select class="select" id="user-role" ${u.id==='u01'?'disabled':''}>${ROLES.map(r=>`<option ${r===u.role?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div class="form-line" style="margin-bottom:14px"><label for="user-scope">Ambito delle informazioni</label><select class="select" id="user-scope" ${u.id==='u01'?'disabled':''}>${['Tutte le LoE',...LOES.map(l=>'LOE '+l.id)].map(r=>`<option ${r===u.scope?'selected':''}>${esc(r)}</option>`).join('')}</select></div><div class="perm-list"><div class="perm-row"><div><b>Consultazione directory membri</b><small>Visualizzazione dati organizzativi autorizzati</small></div><label class="switch"><input id="user-members" type="checkbox" ${u.canMembers?'checked':''} ${u.id==='u01'?'disabled':''}><span class="screenonly">Consultazione directory</span></label></div><div class="perm-row"><div><b>Modifica delle attività</b><small>Solo per gli ambiti assegnati</small></div><label class="switch"><input id="user-edit" type="checkbox" ${u.canEdit?'checked':''} ${u.id==='u01'?'disabled':''}><span class="screenonly">Modifica attività</span></label></div><div class="perm-row"><div><b>Account attivo</b><small>Disattiva senza cancellare l'anagrafica</small></div><label class="switch"><input id="user-active" type="checkbox" ${u.active?'checked':''} ${u.id==='u01'?'disabled':''}><span class="screenonly">Account attivo</span></label></div></div><div class="notice" style="margin-top:15px">Il Super Admin dimostrativo è bloccato per evitare la perdita del ruolo amministrativo. Le email <b>example.invalid</b> non sono indirizzi reali.</div></section></div>`}
function renderContent(){return page==='dashboard'?renderDashboard():page==='members'?renderMembers():page==='timeline'?renderTimeline():page==='projects'?renderProjects():page==='training'?renderTraining():renderAccess()}

function renderModal(){let obj,body='',title='',submit='Salva modifiche';if(modal==='registration'){title='Registrazione membro · Dimostrazione';submit='Invia candidatura demo';body=`<div class="demo-warning"><b>Modulo di prova.</b> Inserisci esclusivamente informazioni fittizie e file di test. Non è attiva una vera iscrizione, nessuna email viene inviata e la richiesta resterà soltanto nella memoria di questa pagina.</div><div class="form-grid"><div class="form-line full form-subhead">Profilo personale</div>${formField('Nome e cognome','name','')}${formField('Email','email','','email')}${formField('Organizzazione','organization','', 'text',false)}${formField('Posizione professionale','position','', 'text',false)}${themePicker()}<div class="form-line full"><label for="bio">Presentazione e competenze</label><textarea id="bio" name="bio" maxlength="800" placeholder="Breve profilo (facoltativo)"></textarea></div><div class="form-line full"><label>Attività alle quali vorresti contribuire</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">${CONTRIBUTIONS.map(c=>`<label class="form-check"><input type="checkbox" name="contributions" value="${esc(c)}">${esc(c)}</label>`).join('')}</div></div>${filePickers()}<div class="form-line full"><label class="form-check"><input type="checkbox" id="demo-only" required>Confermo che sto usando soltanto dati e documenti di prova.</label><small class="muted">In produzione verrà mostrata l'informativa privacy per il trattamento dei dati e dei documenti.</small></div></div>`}
else if(modal==='member'||modal==='newMember'){obj=db.members.find(x=>x.id===modalId)||{name:'',email:'',organization:'',position:'',themes:[],bio:'',role:'',area:'Area Operativa',status:'Attivo',projects:[],contributions:[]};title=modal==='newMember'?'Aggiungi membro':'Scheda membro';body=`<div class="form-grid">${formField('Nome e cognome','name',obj.name)}${formField('Email (facoltativa)','email',obj.email||'','email',false)}${formField('Organizzazione','organization',obj.organization||'','text',false)}${formField('Posizione professionale','position',obj.position||'','text',false)}${themePicker(obj)}<div class="form-line full"><label for="bio">Presentazione / Competenze</label><textarea name="bio" id="bio" maxlength="800">${esc(obj.bio||'')}</textarea></div><div class="form-line full form-subhead">Informazioni organizzative (gestione amministrativa)</div>${formField('Incarico / funzione','role',obj.role)}<div class="form-line"><label for="area">Area organizzativa</label><select id="area" name="area" class="select">${options(['Governance Strategica','Amministrazione e Supporto','Area Operativa'],obj.area)}</select></div><div class="form-line"><label for="status">Stato</label><select name="status" id="status" class="select">${options(['Attivo','Sospeso'],obj.status)}</select></div><div class="form-line full"><label for="projects">Gruppi di progetto (selezione multipla)</label><select name="projects" id="projects" class="select" multiple style="height:113px">${db.projects.map(p=>`<option value="${esc(p.id)}" ${obj.projects.includes(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>${filePickers()}</div>` }else if(modal==='project'||modal==='newProject'){obj=db.projects.find(x=>x.id===modalId)||{name:'',desc:'',loe:3,leadId:'',memberIds:[],outreachEngagements:'',outreachComments:'',status:'Da avviare',date:'2027-03-01'};title=modal==='newProject'?'Nuovo progetto':'Scheda sviluppo tematiche e progetti';body=`<div class="form-grid"><div class="form-line full">${formField('Nome del progetto','name',obj.name)}</div><div class="form-line"><label for="leadId">Project Lead (membro approvato)</label>${selectRegistered(obj.leadId||'')}</div><div class="form-line"><label for="loe">Line of Effort</label><select name="loe" id="loe" class="select">${LOES.map(l=>`<option value="${l.id}" ${l.id===obj.loe?'selected':''}>LOE ${l.id} – ${l.name}</option>`).join('')}</select></div><div class="form-line full"><label for="memberIds">Collaboratori (selezione multipla tra membri approvati)</label>${selectRegistered(obj.memberIds||[],true)}<small class="muted">Ctrl/Cmd + clic per selezionare più membri.</small></div><div class="form-line full"><label for="desc">Mandato e risultati attesi</label><textarea id="desc" name="desc">${esc(obj.desc)}</textarea></div>${formField('Scadenza','date',obj.date,'date')}<div class="form-line"><label for="status">Stato progetto</label><select name="status" id="status" class="select">${options(['Da avviare','In corso','Completato','Sospeso'],obj.status)}</select></div><div class="form-line full form-subhead">Raccordo con Outreach · Ingaggi e osservazioni</div><div class="form-line full"><label for="outreachEngagements">Ingaggi / interlocutori da contattare</label><textarea id="outreachEngagements" name="outreachEngagements" placeholder="Organizzazioni, contatti da sviluppare e stato degli ingaggi">${esc(obj.outreachEngagements||'')}</textarea></div><div class="form-line full"><label for="outreachComments">Commenti Outreach</label><textarea id="outreachComments" name="outreachComments" placeholder="Osservazioni, opportunità, condizioni da sottoporre alla Governance">${esc(obj.outreachComments||'')}</textarea></div></div>${modal==='project'?`<div style="margin-top:22px"><b style="font-size:12px">Attività collegate</b>${db.tasks.filter(t=>t.project===obj.id).map(t=>`<div class="detail-task"><div><b>${esc(taskCode(t))} · ${esc(t.title)}</b><small>${fmtDate(t.due)}</small></div>${statusBadge(t.status)}</div>`).join('')||'<p class="muted">Nessuna attività collegata.</p>'}</div>`:''}` }

else if(modal==='task'||modal==='newTask'){obj=db.tasks.find(x=>x.id===modalId)||{title:'',project:db.projects[0]?.id||'',loe:3,owner:'Da assegnare',start:'2026-11-01',due:'2027-01-31',status:'Da avviare'};title=modal==='newTask'?'Nuova attività':'Modifica attività';body=`<div class="form-grid"><div class="form-line full">${formField('Descrizione attività','title',obj.title)}</div><div class="form-line"><label for="project">Progetto collegato</label><select class="select" id="project" name="project">${db.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===obj.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="form-line"><label for="loe">Line of Effort</label><select class="select" id="loe" name="loe">${LOES.map(l=>`<option value="${l.id}" ${l.id===obj.loe?'selected':''}>LOE ${l.id} – ${l.name}</option>`).join('')}</select></div>${formField('Responsabile','owner',obj.owner)}<div class="form-line"><label for="status">Stato</label><select class="select" id="status" name="status">${options(['Da avviare','In corso','Completato','Sospeso'],obj.status)}</select></div>${formField('Data inizio','start',obj.start,'date')}${formField('Scadenza','due',obj.due,'date')}</div>`}
else if(modal==='course'||modal==='newCourse'){obj=db.courses.find(x=>x.id===modalId)||{name:'',owner:'Da assegnare',category:'Seminario',due:'2027-05-01',status:'Proposta',project:''};title=modal==='newCourse'?'Nuova iniziativa formativa':'Modifica iniziativa';body=`<div class="form-grid"><div class="form-line full">${formField('Nome iniziativa','name',obj.name)}</div>${formField('Responsabile','owner',obj.owner)}<div class="form-line"><label for="category">Tipologia</label><select class="select" id="category" name="category">${options(['Master universitario','Workshop','Seminario','Corso di formazione','Altro'],obj.category)}</select></div>${formField('Data di riferimento','due',obj.due,'date')}<div class="form-line"><label for="status">Stato</label><select id="status" name="status" class="select">${options(['Proposta','In progettazione','In preparazione','Completato'],obj.status)}</select></div><div class="form-line full"><label for="project">Progetto associato</label><select class="select" id="project" name="project"><option value="">Nessuno</option>${db.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===obj.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>`}
else if(modal==='newUser'){title='Nuovo utente Workspace';submit='Aggiungi utente demo';body=`<div class="notice" style="margin-bottom:15px">Questo modulo crea unicamente un profilo dimostrativo locale. Non invia email, non genera credenziali e non autorizza l'accesso reale.</div><div class="form-grid">${formField('Nome visualizzato','name')}${formField('Email di esempio','email','','email')}<div class="form-line"><label for="role">Livello</label><select class="select" id="role" name="role">${options(ROLES.slice(1),'Membro / Collaboratore')}</select></div><div class="form-line"><label for="scope">Ambito</label><select id="scope" name="scope" class="select">${options(['Tutte le LoE',...LOES.map(l=>'LOE '+l.id)],'LOE 3')}</select></div></div>`}
return `<div class="overlay" id="modal-overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title">${title}</h2><button type="button" class="close" data-action="closeModal" aria-label="Chiudi">×</button></div><form id="entity-form"><div class="modal-body">${body}</div><div class="modal-foot"><button type="button" class="btn" data-action="closeModal">Annulla</button><button type="submit" class="btn btn-primary">${submit}</button></div></form></div></div>`}
function toast(s){document.querySelector('.toast')?.remove();let a=document.createElement('div');a.className='toast';a.setAttribute('role','status');a.textContent=s;document.body.appendChild(a);setTimeout(()=>a.remove(),2900)}
function navigate(p){clearStagedFiles();page=p;modal='';mobileOpen=false;render();window.scrollTo(0,0)}
function openModal(mode,id=''){clearStagedFiles();modal=mode;modalId=id;render();setTimeout(()=>document.querySelector('.modal input')?.focus(),0)}
function handleAction(button){let act=button.dataset.action,id=button.dataset.id;if(act==='menu'){mobileOpen=!mobileOpen;render();return}if(act==='closeModal'){closeModal();return}if(act==='refreshDirectory'){if(window.dynamesWorkspaceClient){loadRegisteredMembers(window.dynamesWorkspaceClient).then(()=>{render();toast('Anagrafiche Supabase aggiornate.');}).catch(()=>toast('Impossibile aggiornare il registro.'))}return}if(act==='newTask')return openModal('newTask');if(act==='newMember')return openModal('newMember');if(act==='registration')return openModal('registration');if(act==='removeFile'){removeFile(button.dataset.kind);return}if(act==='approveApplicant'){reviewApplication(id,true);return}if(act==='rejectApplicant'){reviewApplication(id,false);return}if(act==='newProject')return openModal('newProject');if(act==='newCourse')return openModal('newCourse');if(act==='newUser')return openModal('newUser');if(act==='viewMember')return openModal('member',id);if(act==='viewProject')return openModal('project',id);if(act==='editTask')return openModal('task',id);if(act==='editCourse')return openModal('course',id);if(act==='chooseUser'){currentUserId=id;render();return}if(act==='filterTimeline'){timelineLoe=button.dataset.value;render();return}if(act==='resetDemo'){if(confirm('Ripristinare tutti i dati dimostrativi originali?')){db=copy(INITIAL);for(const f of memberFiles.values())for(const kind of ['photo','cv'])if(f[kind]?.url)URL.revokeObjectURL(f[kind].url);memberFiles.clear();for(const a of applications)for(const kind of ['photo','cv'])if(a[kind]?.url)URL.revokeObjectURL(a[kind].url);applications.length=0;clearStagedFiles();save();render();toast('Dati dimostrativi ripristinati.')}return}}
function saveEntity(form){const fd=new FormData(form);const v=k=>(fd.get(k)||'').toString().trim();if(modal==='registration'){submitApplication(form);return}if(modal==='member'||modal==='newMember'){let old=db.members.find(x=>x.id===modalId);let obj={id:old?.id||('m'+Date.now()),name:v('name'),email:v('email'),organization:v('organization'),position:v('position'),themes:themesFromForm(form),bio:v('bio'),role:v('role'),area:v('area'),status:v('status'),projects:Array.from(form.querySelector('[name="projects"]').selectedOptions).map(x=>x.value),contributions:old?.contributions||[]};if(old)Object.assign(old,obj);else db.members.push(obj);applyStagedFiles(obj.id)}
else if(modal==='project'||modal==='newProject'){let old=db.projects.find(x=>x.id===modalId);const leadId=v('leadId');const memberIds=Array.from(form.querySelector('[name="memberIds"]').selectedOptions).map(x=>x.value);let obj={id:old?.id||('p'+Date.now()),name:v('name'),leadId,memberIds:memberIds.filter(x=>x!==leadId),loe:Number(v('loe')),desc:v('desc'),date:v('date'),status:v('status'),outreachEngagements:v('outreachEngagements'),outreachComments:v('outreachComments')};if(old)Object.assign(old,obj);else db.projects.push(obj)}
else if(modal==='task'||modal==='newTask'){let old=db.tasks.find(x=>x.id===modalId);if(v('due')<v('start')){toast('La scadenza non può precedere la data di inizio.');return}let obj={id:old?.id||('t'+Date.now()),title:v('title'),project:v('project'),loe:Number(v('loe')),owner:v('owner'),start:v('start'),due:v('due'),status:v('status'),code:old?.code||(old?taskCode(old):'A-'+String(Math.max(0,...db.tasks.map(x=>Number(String(taskCode(x)).replace(/\D/g,''))||0))+1).padStart(4,'0'))};if(old)Object.assign(old,obj);else db.tasks.push(obj)}
else if(modal==='course'||modal==='newCourse'){let old=db.courses.find(x=>x.id===modalId);let obj={id:old?.id||('c'+Date.now()),name:v('name'),owner:v('owner'),category:v('category'),due:v('due'),status:v('status'),project:v('project')};if(old)Object.assign(old,obj);else db.courses.push(obj)}
else if(modal==='newUser'){if(!v('email').toLowerCase().endsWith('.invalid')){toast('Per la demo usa un indirizzo con dominio .invalid.');return}if(db.users.some(u=>u.email.toLowerCase()===v('email').toLowerCase())){toast('Questa email demo è già presente.');return}db.users.push({id:'u'+Date.now(),name:v('name'),email:v('email'),role:v('role'),scope:v('scope'),active:false,canEdit:false,canMembers:false})}
save();modal='';render();toast('Modifica salvata nel browser (demo).')}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}let a=e.target.closest('[data-action]');if(a){handleAction(a);return}if(e.target.id==='modal-overlay'){closeModal()}});
document.addEventListener('submit',e=>{if(e.target.id==='entity-form'){e.preventDefault();if(!e.target.reportValidity()||!validateThemes(e.target))return;saveEntity(e.target)}});
document.addEventListener('change',e=>{let t=e.target;if(t.name==='themes'){refreshThemeFeedback();return}if(t.id==='photoFile'||t.id==='cvFile'){handleFileInput(t);return}if(t.classList.contains('assignment-select')){db.memberAssignments=db.memberAssignments||{};if(!registeredMembers.some(m=>m.id===t.dataset.memberId))return;db.memberAssignments[t.dataset.memberId]=t.value;save();render();toast('Incarico demo aggiornato: nessuna nomina o permesso reale è stato modificato.');return}if(t.id==='members-area'){memberArea=t.value;render()}if(t.id==='projects-loe'){projectLoe=t.value;render()}if(['user-role','user-scope','user-members','user-edit','user-active'].includes(t.id)){let u=db.users.find(x=>x.id===currentUserId);if(!u||u.id==='u01')return;let key={'user-role':'role','user-scope':'scope','user-members':'canMembers','user-edit':'canEdit','user-active':'active'}[t.id];u[key]=t.type==='checkbox'?t.checked:t.value;save();render();toast('Permessi demo aggiornati nel browser.')}});
document.addEventListener('input',e=>{if(e.target.id==='members-search'){memberSearch=e.target.value;let arr=registeredMembers.filter(m=>{const j=jobFor(db.memberAssignments?.[m.id]||'');return (memberArea==='Tutte le aree'||j?.area===memberArea)&&[m.name,m.position,j?.title||''].join(' ').toLowerCase().includes(memberSearch.toLowerCase())});document.getElementById('members-table').innerHTML=memberRows(arr);document.getElementById('members-count').textContent=arr.length+' membri'}if(e.target.id==='project-search'){projectSearch=e.target.value;let f=document.activeElement.selectionStart;render();let s=document.getElementById('project-search');s.focus();s.setSelectionRange(f,f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal()}});

window.dynamesWorkspaceAuthorized=false;
async function initializeAuthenticatedWorkspace(){
  const gate=document.getElementById('workspace-gate');
  const gateMessage=document.getElementById('workspace-gate-message');
  try{
    if(!window.supabase?.createClient)throw new Error('Libreria di autenticazione non disponibile');
    const client=window.supabase.createClient('https://qcbvujamcpstvxdrfahm.supabase.co',
      'sb_publishable_Zq7Z-hVgwxzrKwgITkVIHQ_MNsr31nD',
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data:login,error:loginError}=await client.auth.getUser();
    if(loginError||!login?.user){
      gateMessage.textContent='Per entrare nel Workspace accedi prima al portale DYNAMES.';
      return;
    }
    const uid=login.user.id;
    const [m,g]=await Promise.all([
      client.from('members').select('status').eq('user_id',uid).maybeSingle(),
      client.from('access_grants').select('id').eq('user_id',uid).eq('role_code','super_admin').eq('scope_type','global').is('revoked_at',null).maybeSingle()
    ]);
    if(m.error||g.error)throw new Error('Verifica permessi non riuscita');
    if(m.data?.status!=='active'||!g.data?.id){
      gateMessage.textContent='Accesso non autorizzato. L’anteprima organizzativa è attualmente riservata al Super Admin.';
      return;
    }
    window.dynamesWorkspaceAuthorized=true;
    window.dynamesWorkspaceClient=client;
    await loadRegisteredMembers(client);
    gate.hidden=true;
    document.getElementById('app').hidden=false;
    render();
  }catch(e){console.error('Workspace access:',e);gateMessage.textContent='Verifica non riuscita. Controlla la connessione o torna al portale di accesso.';}
}
document.addEventListener('click',async e=>{
  if(e.target.closest('#workspace-signout')){
    try{await window.dynamesWorkspaceClient?.auth.signOut()}catch(err){console.error('Logout:',err)}
    window.location.replace('/workspace/verifica-accesso.html');
  }
});
initializeAuthenticatedWorkspace();
</script>
