name: Phase 2 path fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2-path-fixes.yml'

permissions:
  contents: write

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified path fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_required(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Required pattern not found in {path}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No changes produced for {path}')
              p.write_text(text, encoding='utf-8')

          # DDL: guerra ibrida — file is two directory levels below repository root.
          replace_required(
              'articles/2026.08.04-ddl/2026.08.04-guerra-ibrida.html',
              [
                  ('https://www.dynames.it/articles/2026.08.04-guerra-ibrida.html',
                   'https://www.dynames.it/articles/2026.08.04-ddl/2026.08.04-guerra-ibrida.html'),
                  ('href="../index.html"', 'href="../../index.html"'),
                  ('href="../hub.html"', 'href="../../hub.html"'),
                  ('href="../pubblicazioni.html"', 'href="../../pubblicazioni.html"'),
                  ('href="../eventi.html"', 'href="../../eventi.html"'),
                  ('href="../chi-siamo.html"', 'href="../../chi-siamo.html"'),
                  ('href="../temi-e-collaborazioni.html"', 'href="../../temi-e-collaborazioni.html"'),
                  ('src="../assets/', 'src="../../assets/'),
              ],
          )

          # DDL: infrastrutture — same nesting depth; canonical and article-local images are already correct.
          replace_required(
              'articles/2026.08.04-ddl/2026.08.04-infrastrutture-difesa.html',
              [
                  ('href="../index.html"', 'href="../../index.html"'),
                  ('href="../hub.html"', 'href="../../hub.html"'),
                  ('href="../pubblicazioni.html"', 'href="../../pubblicazioni.html"'),
                  ('href="../eventi.html"', 'href="../../eventi.html"'),
                  ('href="../chi-siamo.html"', 'href="../../chi-siamo.html"'),
                  ('href="../temi-e-collaborazioni.html"', 'href="../../temi-e-collaborazioni.html"'),
                  ('src="../assets/', 'src="../../assets/'),
              ],
          )

          # Evento 18/09/2025 — page is one directory below repository root.
          replace_required(
              'events/20250918-cultura-della-difesa.html',
              [
                  ('href="assets/', 'href="../assets/'),
                  ('src="assets/', 'src="../assets/'),
                  ('href="index.html"', 'href="../index.html"'),
                  ('href="hub.html"', 'href="../hub.html"'),
                  ('href="pubblicazioni.html"', 'href="../pubblicazioni.html"'),
                  ('href="eventi.html"', 'href="../eventi.html"'),
                  ('href="chi-siamo.html"', 'href="../chi-siamo.html"'),
                  ('href="temi-e-collaborazioni.html"', 'href="../temi-e-collaborazioni.html"'),
              ],
          )

          # Sanity checks: no known broken forms may remain.
          guerra = Path('articles/2026.08.04-ddl/2026.08.04-guerra-ibrida.html').read_text(encoding='utf-8')
          infra = Path('articles/2026.08.04-ddl/2026.08.04-infrastrutture-difesa.html').read_text(encoding='utf-8')
          evento = Path('events/20250918-cultura-della-difesa.html').read_text(encoding='utf-8')

          for bad in [
              'href="../index.html"', 'href="../hub.html"', 'href="../pubblicazioni.html"',
              'href="../eventi.html"', 'href="../temi-e-collaborazioni.html"', 'src="../assets/'
          ]:
              if bad in guerra or bad in infra:
                  raise SystemExit(f'Broken DDL path remains: {bad}')

          if 'https://www.dynames.it/articles/2026.08.04-guerra-ibrida.html' in guerra:
              raise SystemExit('Old guerra-ibrida canonical/OG URL remains')

          for bad in [
              'href="index.html"', 'href="hub.html"', 'href="pubblicazioni.html"',
              'href="eventi.html"', 'href="chi-siamo.html"', 'href="temi-e-collaborazioni.html"',
              'href="assets/', 'src="assets/'
          ]:
              if bad in evento:
                  raise SystemExit(f'Broken event path remains: {bad}')

      - name: Validate diff
        run: |
          git diff --check
          git diff --exit-code -- . ':!articles/2026.08.04-ddl/2026.08.04-guerra-ibrida.html' ':!articles/2026.08.04-ddl/2026.08.04-infrastrutture-difesa.html' ':!events/20250918-cultura-della-difesa.html'
          git diff --stat

      - name: Commit fixes
        run: |
          git config user.name "DynamesIT Automation"
          git config user.email "redazione@dynames.it"
          git add articles/2026.08.04-ddl/2026.08.04-guerra-ibrida.html \
                  articles/2026.08.04-ddl/2026.08.04-infrastrutture-difesa.html \
                  events/20250918-cultura-della-difesa.html
          git commit -m "Fix verified DDL and event paths"
          git push origin HEAD:main
