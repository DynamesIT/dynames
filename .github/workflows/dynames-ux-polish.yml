name: DYNAMES UX polish sync

on:
  push:
    paths:
      - '.sync/final.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/chunk-* > /tmp/dynfix.b64
          base64 -d /tmp/dynfix.b64 > /tmp/dynfix.tar.xz
          echo "2b3c3c2dcb88f87d64b1e944754e7d690e5fc3e31faec665a38c147d41a73923  /tmp/dynfix.tar.xz" | sha256sum -c -
          tar -xJf /tmp/dynfix.tar.xz -C .

      - name: Verify target files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dynfix.sha256 <<'EOF'
          a612a4d32ed722333a5cfe7e0567367509f728dfe8a12ceba6ca563bb68c7f9d  chi-siamo.html
          3e75f5e5ba1cb7f2060a556f25f3b6532c78349c448268311246ea7e4bafe488  articles/2026.08.04-ddl-difesa.html
          EOF
          sha256sum -c /tmp/dynfix.sha256

      - name: Commit polished masters
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/dynames-ux-polish.yml
          git config user.name "DynamesIT"
          git config user.email "redazione@dynames.it"
          git add -A -- chi-siamo.html articles/2026.08.04-ddl-difesa.html .sync .github/workflows/dynames-ux-polish.yml
          git commit -m "Polish desktop bios and DDL markup"
          git push
