name: Bio arrow-only toggle

on:
  push:
    branches:
      - bio-arrow-only-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace bio labels with arrow-only controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('chi-siamo.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(
              r'<button aria-controls="([^"]+)" aria-expanded="false" class="bio-expand-btn" type="button">Leggi la bio</button>',
              r'<button aria-controls="\1" aria-expanded="false" aria-label="Espandi la biografia" class="bio-expand-btn" type="button"></button>',
              s
          )
          if n != 45:
              raise SystemExit(f'Expected 45 bio buttons, changed {n}')

          s, n_css = re.subn(
              r'\.bio-expand-btn \{\s*display: none;\s*margin: 0\.85rem auto 0;\s*padding: 0\.5rem 0\.85rem;',
              '.bio-expand-btn {\n            display: none;\n            width: 2.25rem;\n            height: 2.25rem;\n            margin: 0.85rem auto 0;\n            padding: 0;',
              s,
              count=1
          )
          if n_css != 1:
              raise SystemExit(f'Expected one button CSS block, changed {n_css}')

          s, n_arrow = re.subn(
              r'\.bio-expand-btn::after \{\s*content: "↓";\s*margin-left: 0\.45rem;\s*color: var\(--gold-accent\);',
              '.bio-expand-btn::after {\n            content: "↓";\n            margin-left: 0;\n            color: var(--gold-accent);\n            font-size: 1.05rem;\n            line-height: 1;',
              s,
              count=1
          )
          if n_arrow != 1:
              raise SystemExit(f'Expected one arrow CSS block, changed {n_arrow}')

          old_js = "button.firstChild.nodeValue = expanded ? 'Chiudi la bio' : 'Leggi la bio';"
          new_js = "button.setAttribute('aria-label', expanded ? 'Comprimi la biografia' : 'Espandi la biografia');"
          if old_js not in s:
              raise SystemExit('Toggle JS line not found')
          s = s.replace(old_js, new_js, 1)

          if 'Leggi la bio' in s or 'Chiudi la bio' in s:
              raise SystemExit('Visible bio labels still present')

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "DynamesIT"
          git config user.email "redazione@dynames.it"
          git add chi-siamo.html
          git commit -m "Use arrow-only bio toggles"
          git push origin HEAD:main
