name: Publish Fabio Marotta profile

on:
  push:
    paths:
      - '.github/workflows/publish-fabio-marotta.yml'
      - '.deploy/fabio-marotta/**'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild updated files
        shell: bash
        run: |
          cat .deploy/fabio-marotta/html.part*.b64 | base64 -d | gzip -d > chi-siamo.html
          cat .deploy/fabio-marotta/jpg.part*.b64 | base64 -d > assets/sme-contributors/fabio-marotta.jpg
          grep -q "Fabio Marotta" chi-siamo.html
          test -s assets/sme-contributors/fabio-marotta.jpg
      - name: Commit publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .deploy/fabio-marotta
          git rm -f .github/workflows/publish-fabio-marotta.yml
          git add -A chi-siamo.html assets/sme-contributors/fabio-marotta.jpg .deploy .github/workflows
          git commit -m "Add Fabio Marotta to SME & Contributors"
          git push
