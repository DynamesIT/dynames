name: Fix social preview metadata

on:
  push:
    paths:
      - '.github/workflows/fix-critica-vittima.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch article metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('articles/2026.08.17-critica-della-vittima.html')
          text = path.read_text(encoding='utf-8')

          # Use the single canonical social image already present in the repository.
          text = text.replace(
              '2026.08.17-critica-della-vittima-whatsapp.jpg',
              '2026.08.17-critica-della-vittima-share.jpg'
          )

          # Move encoding/viewport/title to the very beginning of <head>.
          charset = '<meta charset="utf-8"/>'
          viewport = '<meta content="width=device-width, initial-scale=1.0" name="viewport"/>'
          title = '<title>DYNAMES | Il paradigma vittimario</title>'

          for tag in (charset, viewport, title):
              text = text.replace(tag, '')

          early = '\n'.join((charset, viewport, title))
          text = text.replace('<head>', '<head>\n' + early, 1)

          # Ensure og:image:url exists and follows the same canonical share image.
          share_url = 'https://www.dynames.it/articles/Immagini/2026.08.17-critica-della-vittima-share.jpg'
          if 'property="og:image:url"' not in text:
              marker = f'<meta content="{share_url}" property="og:image"/>'
              text = text.replace(
                  marker,
                  marker + f'\n<meta content="{share_url}" property="og:image:url"/>',
                  1
              )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-critica-vittima.yml
          git config user.name "DynamesIT Automation"
          git config user.email "redazione@dynames.it"
          git add articles/2026.08.17-critica-della-vittima.html .github/workflows/fix-critica-vittima.yml
          if ! git diff --cached --quiet; then
            git commit -m "Fix WhatsApp social preview metadata"
            git push origin main
          fi
