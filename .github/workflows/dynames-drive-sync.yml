name: DYNAMES Drive sync

on:
  push:
    paths:
      - '.sync/final.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/chunk-* > /tmp/dynames_sync.b64
          base64 -d /tmp/dynames_sync.b64 > /tmp/dynames_sync.tar.xz
          echo "fbef7081b1a37172d7d30c194278ee54575556102b5059cc33a0912a2aa295b7  /tmp/dynames_sync.tar.xz" | sha256sum -c -
          tar -xJf /tmp/dynames_sync.tar.xz -C .

      - name: Verify synchronized files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dynames_sha256.txt <<'EOF'
          1d85fba4ea52f0605df90a83968ae0090a80e34bb1b76d9e443cf143acd5d938  index.html
          8d95e4a8e813ff7979657fd8863aa7522b69e5fe6327c29d008d0ab3a864d35c  chi-siamo.html
          65450eece7ce586beca78a192c255fac88d127546fa5a3dda521a7687f30945a  articles/2026.08.04-ddl-difesa.html
          cfe879b704af1de2198f229c3997bbaf0166fb99f4a22cf63ce1373360dd3c7f  articles/2026.08.04-ddl/2026.08.04-cyber-autonomia-competenze.html
          2007328a1363b6da5f90dad4444dbe7b5655880b874cd76e372bff73be8d5ff2  articles/2026.08.04-ddl/2026.08.04-governance-decisione.html
          46af0f6fd9c8f69ef502f671fa5df71bfd1da597cae3f57904a3e9d8400d80d6  articles/2026.08.04-ddl/2026.08.04-guerra-ibrida.html
          42db206c70c0d0e88bfd3f19afaf006e7d3e38a7a8ca4c903a71563ff609efb9  articles/2026.08.04-ddl/2026.08.04-infrastrutture-difesa.html
          dd1d8d7a04ef5c82c4b257342018a32e79243eb15b77fa61c22e055fd3a77a37  articles/2026.08.04-ddl/2026.08.04-personale-militare.html
          7fceb46fc32f36b938ec804337189568caa3ca38e965d0ad63e3afed126165d7  articles/2026.08.04-ddl/2026.08.04-sovranita-multidominio.html
          c769fb21d96437b3fe4f3466507943eb4e9315daf76f569384eb1f5846677dfb  articles/2026.08.04-ddl/2026.08.06-difesa-politica-industriale-nuovo-ddl.html
          EOF
          sha256sum -c /tmp/dynames_sha256.txt

      - name: Commit synchronized masters
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/dynames-drive-sync.yml
          git config user.name "DynamesIT"
          git config user.email "redazione@dynames.it"
          git add index.html chi-siamo.html articles/2026.08.04-ddl-difesa.html articles/2026.08.04-ddl .sync .github/workflows/dynames-drive-sync.yml
          git commit -m "Sync validated mobile UX improvements from Drive"
          git push
