name: DYNAMES repository audit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  audit:
    if: github.event.issue.title == 'dynames-full-repository-audit-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import hashlib, re, os
          from collections import defaultdict

          root = Path('.').resolve()
          files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          rels = {p.relative_to(root).as_posix(): p for p in files}

          # Exact duplicate byte content.
          by_hash = defaultdict(list)
          sizes = {}
          for rel, p in rels.items():
              try:
                  data = p.read_bytes()
              except Exception:
                  continue
              sizes[rel] = len(data)
              by_hash[hashlib.sha256(data).hexdigest()].append(rel)
          dup_groups = [sorted(v) for v in by_hash.values() if len(v) > 1]
          dup_groups.sort(key=lambda g: (-max(sizes.get(x,0) for x in g), g))

          text_exts = {'.html','.htm','.css','.js','.json','.md','.txt','.xml','.py','.yml','.yaml'}
          media_exts = {'.png','.jpg','.jpeg','.jfif','.webp','.gif','.svg','.pdf','.mp4','.webm','.avif'}
          incoming = defaultdict(set)
          broken = []
          external_like = ('http://','https://','mailto:','tel:','data:','javascript:','//','#')

          attr_re = re.compile(r'''(?:href|src|poster)\s*=\s*["']([^"']+)["']''', re.I)
          css_re = re.compile(r'''url\(\s*["']?([^"')]+)["']?\s*\)''', re.I)
          js_re = re.compile(r'''(?:location(?:\.href|\.replace)?|window\.open)\s*\(?\s*["']([^"']+)["']''', re.I)

          def resolve_ref(source, raw):
              raw = raw.strip()
              if not raw or raw.lower().startswith(external_like):
                  return None
              # Ignore templating/data placeholders.
              if '{' in raw or '}' in raw:
                  return None
              clean = unquote(raw.split('#',1)[0].split('?',1)[0]).strip()
              if not clean:
                  return None
              if clean.startswith('/'):
                  target = Path(clean.lstrip('/'))
              else:
                  target = Path(source).parent / clean
              try:
                  target = Path(os.path.normpath(target.as_posix()))
              except Exception:
                  return None
              return target.as_posix().lstrip('./')

          text_cache = {}
          for rel, p in rels.items():
              if p.suffix.lower() not in text_exts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              text_cache[rel] = text
              refs = []
              refs += attr_re.findall(text)
              refs += css_re.findall(text)
              refs += js_re.findall(text)
              for raw in refs:
                  target = resolve_ref(rel, raw)
                  if not target:
                      continue
                  # Directory links are considered valid if the directory exists.
                  tp = root / target
                  if tp.exists():
                      if tp.is_file():
                          incoming[target].add(rel)
                      continue
                  # Common browser behavior: href to directory may map to index.html.
                  if (root / target / 'index.html').exists():
                      incoming[(Path(target)/'index.html').as_posix()].add(rel)
                      continue
                  broken.append((rel, raw, target))

          # Likely unreferenced media and HTML.
          unref_media = sorted([
              rel for rel,p in rels.items()
              if p.suffix.lower() in media_exts and not incoming.get(rel)
          ])
          protected_html = {
              'index.html','hub.html','pubblicazioni.html','eventi.html','chi-siamo.html',
              'temi-e-collaborazioni.html','Privacy-Policy.html','accredito.html',
              'progetto.html','premio-cultura-della-difesa.html','osint-tools.html','articolo-template.html'
          }
          unref_html = sorted([
              rel for rel,p in rels.items()
              if p.suffix.lower() in {'.html','.htm'} and rel not in protected_html and not incoming.get(rel)
          ])

          # Canonical / Open Graph URL consistency for articles and publications.
          meta_issues = []
          canon_re = re.compile(r'''<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']|<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["']''', re.I)
          og_re = re.compile(r'''<meta[^>]+property=["']og:url["'][^>]+content=["']([^"']+)["']|<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:url["']''', re.I)
          for rel,text in text_cache.items():
              if not (rel.startswith('articles/') or rel.startswith('pubblicazioni/')) or not rel.endswith('.html'):
                  continue
              expected = 'https://www.dynames.it/' + rel
              cm = canon_re.search(text)
              om = og_re.search(text)
              canonical = next((x for x in (cm.groups() if cm else []) if x), None)
              ogurl = next((x for x in (om.groups() if om else []) if x), None)
              if canonical and canonical.rstrip('/') != expected.rstrip('/'):
                  meta_issues.append((rel,'canonical',canonical,expected))
              if ogurl and ogurl.rstrip('/') != expected.rstrip('/'):
                  meta_issues.append((rel,'og:url',ogurl,expected))
              if not canonical:
                  meta_issues.append((rel,'canonical MISSING','',expected))
              if not ogurl:
                  meta_issues.append((rel,'og:url MISSING','',expected))

          # Suspicious / inconsistent naming and one-off tooling.
          suspicious = []
          root_dated = re.compile(r'^\d{4}\.\d{2}\.\d{2}-.+\.html$', re.I)
          temp_name_re = re.compile(r'(?:^|[-_.])(saved|backup|bak|copy|old|temp|tmp)(?:[-_.]|$)|\(\d+\)', re.I)
          for rel,p in rels.items():
              base = p.name
              reasons=[]
              if base.lower() in {'desktop.ini','thumbs.db','.ds_store'}:
                  reasons.append('OS metadata')
              if temp_name_re.search(base):
                  reasons.append('backup/temp-style filename')
              if '/' not in rel and root_dated.match(base):
                  reasons.append('dated article at repository root')
              if '/' not in rel and p.suffix.lower() in {'.py','.json','.txt'}:
                  reasons.append('root tooling/report file')
              if rel.startswith('articles/') and any(ch.isupper() for ch in base):
                  reasons.append('uppercase in article filename')
              if rel.startswith('articles/') and any(ord(ch)>127 for ch in base):
                  reasons.append('non-ASCII in article filename')
              if reasons:
                  suspicious.append((rel, '; '.join(reasons)))

          stale_content=[]
          needles = {
              'G-DFL8MJSKVJ':'obsolete Google Analytics ID',
              'c:/Users/':'absolute Windows development path',
              'Immagine hero:':'editorial placeholder leaked into HTML',
              'Immagine hero da associare':'editorial placeholder leaked into HTML',
              '2026.08.17-critica-della-vittima.html':'old paradigma-vittimario URL reference',
          }
          for rel,text in text_cache.items():
              for needle,label in needles.items():
                  if needle in text:
                      stale_content.append((rel,label,needle,text.count(needle)))

          # Large files.
          largest = sorted(sizes.items(), key=lambda x:x[1], reverse=True)[:30]

          # Filename duplicate-at-root vs canonical directory same basename & hash.
          root_dup=[]
          for rel,p in rels.items():
              if '/' in rel: continue
              for prefix in ('articles/','assets/','pubblicazioni/'):
                  other = prefix + p.name
                  if other in rels and by_hash and hashlib.sha256(p.read_bytes()).hexdigest() == hashlib.sha256(rels[other].read_bytes()).hexdigest():
                      root_dup.append((rel,other))

          def fmt_list(items, formatter, limit=80):
              lines=[]
              for item in items[:limit]:
                  lines.append('- ' + formatter(item))
              if len(items)>limit:
                  lines.append(f'- … altri {len(items)-limit}')
              return '\n'.join(lines) if lines else '- Nessuno'

          report=[]
          report.append('# Audit repository DYNAMES')
          report.append(f'Commit analizzato: `{os.environ.get("GITHUB_SHA","")}`')
          report.append(f'File totali: **{len(rels)}**')

          report.append('\n## 1. Duplicati byte-per-byte')
          report.append(f'Gruppi: **{len(dup_groups)}**')
          report.append(fmt_list(dup_groups, lambda g: ' | '.join(f'`{x}`' for x in g), 60))

          report.append('\n## 2. Duplicati root ↔ directory canonica')
          report.append(fmt_list(root_dup, lambda x: f'`{x[0]}` = `{x[1]}`', 60))

          report.append('\n## 3. Riferimenti locali rotti')
          report.append(f'Totale: **{len(broken)}**')
          report.append(fmt_list(sorted(set(broken)), lambda x: f'`{x[0]}` → `{x[1]}` (risolto come `{x[2]}`)', 100))

          report.append('\n## 4. Media/PDF senza riferimenti rilevati')
          report.append(f'Totale candidati: **{len(unref_media)}**')
          report.append(fmt_list(unref_media, lambda x: f'`{x}`', 100))

          report.append('\n## 5. HTML senza link in ingresso rilevati')
          report.append(f'Totale candidati: **{len(unref_html)}**')
          report.append(fmt_list(unref_html, lambda x: f'`{x}`', 100))

          report.append('\n## 6. Canonical / og:url incoerenti o mancanti')
          report.append(f'Totale: **{len(meta_issues)}**')
          report.append(fmt_list(meta_issues, lambda x: f'`{x[0]}` — **{x[1]}**: `{x[2] or "—"}`; atteso `{x[3]}`', 100))

          report.append('\n## 7. File/naming sospetti')
          report.append(fmt_list(sorted(suspicious), lambda x: f'`{x[0]}` — {x[1]}', 100))

          report.append('\n## 8. Contenuti/configurazioni obsolete o incoerenti')
          report.append(fmt_list(sorted(stale_content), lambda x: f'`{x[0]}` — {x[1]} (`{x[2]}`, occorrenze: {x[3]})', 100))

          report.append('\n## 9. File più pesanti')
          report.append(fmt_list(largest, lambda x: f'`{x[0]}` — {x[1]/1024/1024:.2f} MB', 30))

          Path('/tmp/audit.md').write_text('\n'.join(report), encoding='utf-8')
          PY

      - name: Comment audit report and close issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/audit.md
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/dynames-repository-audit.yml
          git config user.name "DynamesIT Automation"
          git config user.email "redazione@dynames.it"
          git add .github/workflows/dynames-repository-audit.yml
          git commit -m "Remove temporary repository audit workflow"
          git push origin main
