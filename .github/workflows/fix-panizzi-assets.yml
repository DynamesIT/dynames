name: Repair Panizzi hero assets

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  repair:
    if: github.event.issue.title == '[DYNAMES] repair Panizzi hero assets'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore high-resolution hero assets from Drive master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p articles/Immagini
          curl --fail --location --retry 3 'https://drive.google.com/uc?export=download&id=1RI-9UVa0gkRi6xOEnJUkqNo3xXzbTC0i' -o articles/Immagini/2026.08.25-afghanista-italia-panizzi.jpg
          curl --fail --location --retry 3 'https://drive.google.com/uc?export=download&id=16zVs3iUKzCWxWRWPFN22FxL54JBituKU' -o articles/Immagini/2026.08.25-afghanista-italia-panizzi-light.jpg
          python3 - <<'PY'
          from pathlib import Path

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise SystemExit(f'{path}: not a JPEG')
              i = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8,0xD9) or 0xD0 <= marker <= 0xD7:
                      continue
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in sof:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += length
              raise SystemExit(f'{path}: JPEG dimensions not found')

          main = 'articles/Immagini/2026.08.25-afghanista-italia-panizzi.jpg'
          light = 'articles/Immagini/2026.08.25-afghanista-italia-panizzi-light.jpg'
          assert jpeg_size(main) == (1320, 880), jpeg_size(main)
          assert jpeg_size(light) == (1200, 630), jpeg_size(light)
          print('Verified:', main, jpeg_size(main))
          print('Verified:', light, jpeg_size(light))
          PY

      - name: Commit repaired assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DynamesIT'
          git config user.email 'redazione@dynames.it'
          git add articles/Immagini/2026.08.25-afghanista-italia-panizzi.jpg articles/Immagini/2026.08.25-afghanista-italia-panizzi-light.jpg
          if git diff --cached --quiet; then
            echo 'Assets already correct.'
          else
            git commit -m 'Restore Panizzi Afghanistan hero resolution'
            git push origin HEAD:main
          fi
