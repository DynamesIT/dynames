name: Publish guerra rapida article

on:
  push:
    paths:
      - '.github/workflows/publish-guerra-rapida.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download staged DYNAMES files from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p articles/Immagini

          download_drive() {
            local id="$1"
            local out="$2"
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              --output "$out"
          }

          download_drive "1nYcvTddda8Kb3WF18qrc-X6OD5__bBEL" "articles/2026.08.24-guerra-rapida.html"
          download_drive "1WK5Dpg60JfRIIQZOMxbDPRDDVpyIDTZS" "articles/Immagini/2026.08.24-guerra-rapida.png"
          download_drive "1N2wByovHNG03QATgcrIQoXxdZ1byTOwQ" "articles/Immagini/2026.08.24-guerra-rapida-light.jpg"

      - name: Validate downloaded files
        shell: bash
        run: |
          set -euo pipefail
          test -s articles/2026.08.24-guerra-rapida.html
          grep -q '<title>DYNAMES | Se è mai esistita la guerra rapida</title>' articles/2026.08.24-guerra-rapida.html
          grep -q 'Immagini/2026.08.24-guerra-rapida.png' articles/2026.08.24-guerra-rapida.html
          grep -q '2026.08.24-guerra-rapida-light.jpg' articles/2026.08.24-guerra-rapida.html
          file articles/Immagini/2026.08.24-guerra-rapida.png | grep -q 'PNG image data'
          file articles/Immagini/2026.08.24-guerra-rapida-light.jpg | grep -Eq 'JPEG image data|JPEG image'

      - name: Publish and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DynamesIT"
          git config user.email "redazione@dynames.it"
          git add articles/2026.08.24-guerra-rapida.html \
                  articles/Immagini/2026.08.24-guerra-rapida.png \
                  articles/Immagini/2026.08.24-guerra-rapida-light.jpg
          git rm .github/workflows/publish-guerra-rapida.yml
          git commit -m "Publish Cristadoro guerra rapida article and hero assets"
          git push origin HEAD:main
