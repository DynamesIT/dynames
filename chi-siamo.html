<body>
<div class="loading"><div><h1>DYNAMES</h1><p>Caricamento della pagina…</p></div></div>
<script>
(async function(){
  const profile = `\n<!-- Fabio Marotta -->\n<div class="author-box" id="fabio-marotta">\n<img alt="Fabio Marotta" onerror="this.style.display='none';" src="assets/sme-contributors/fabio-marotta.svg"/>\n<div class="author-info">\n<details class="bio-toggle"><summary aria-label="Mostra o nascondi la biografia di Fabio Marotta" class="bio-summary"><span class="bio-summary-copy"><span aria-level="4" class="profile-name" role="heading">Fabio Marotta</span><span class="strategic-theme"><span>Ambiti di competenza</span><strong>Governance Pubblica · Difesa e Sicurezza</strong></span></span></summary><div class="bio-content"><p>Analista e auditor certificato di organizzazioni, con esperienza internazionale pluriennale al livello politico-strategico. È abituato a navigare tra le complessità strutturali e legali dei sistemi di governance nazionali e internazionali, dove analizza architetture organizzative, valida requisiti di capitale umano e verifica la coerenza tra mandato, struttura e risorse. Individua gap, raccomanda soluzioni, risolve problemi. Il suo contributo approfondisce il rapporto tra progettazione organizzativa, sostenibilità delle strutture ed efficacia dell'azione istituzionale.</p></div></details></div>\n</div>`;
  try {
    const r = await fetch('/chi-siamo-base.html?v=20260822-1', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html = await r.text();
    const marker = '<!-- Filippo Martini -->';
    const markerPos = html.indexOf(marker);
    if(markerPos < 0) throw new Error('Profilo di riferimento non trovato');
    const after = html.indexOf('</div>\n</div>\n</section>', markerPos);
    if(after < 0) throw new Error('Griglia SME non trovata');
    const insertAt = after + '</div>'.length;
    html = html.slice(0, insertAt) + profile + html.slice(insertAt);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML='<div class="loading"><div><h1>DYNAMES</h1><p>Impossibile caricare temporaneamente la pagina. Riprova tra poco.</p></div></div>';
    console.error(e);
  }
})();
</script>
